name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, tokenlens-pi]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Deploy
        run: docker compose up -d --build

      - name: Prune old images
        run: docker image prune -f
