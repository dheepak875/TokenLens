<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TokenLens - Privacy-First JWT / JWS / JWE Workbench</title>
    <meta
      name="description"
      content="A privacy-first developer security workbench to inspect, verify, generate, compare, and understand JSON Web Tokens (JWT/JWS/JWE) with a plain-English Security Report."
    />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0b0f19" />
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
